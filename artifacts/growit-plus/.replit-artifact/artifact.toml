kind = "web"
previewPath = "/"
title = "GrowIt"
version = "1.0.0"
id = "artifacts/growit-plus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19896

[services.development]
run = "pnpm --filter @workspace/growit-plus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/growit-plus", "run", "build" ]
publicDir = "artifacts/growit-plus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19896"
BASE_PATH = "/"
